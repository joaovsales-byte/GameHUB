info:
  name: post_jogos
  type: http

http:
  method: POST
  url: http://localhost:3000/jogos
  body:
    type: json
    data: |-
      {
        "titulo": "Minecraft",
        "ano_lancamento": 2011,
        "estudio_id": 1
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
